name: DOJO CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "42 06 * * *"
jobs:
  test:
    name: "${{ matrix.mode }} ${{ matrix.tier }} Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DISCORD_CLIENT_SECRET: test-discord-client-secret
    strategy:
      matrix:
        include:
          - mode: singlenode
            tier: semantic
            selection: semantic
            coverage: true
          - mode: singlenode
            tier: contract
            selection: contract
            coverage: true
          - mode: singlenode
            tier: integration
            selection: integration or unit
            coverage: true
          - mode: multinode
            tier: topology
            selection: multinode
            coverage: false
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Host information
        run: |
          echo "::group::Host information"
          echo "Hostname: $(hostname)"
          echo "OS: $(lsb_release -d | cut -f2)"
          echo "Kernel: $(uname -r)"
          echo "Architecture: $(uname -m)"
          echo "IP: $(hostname -I)"
          echo "::endgroup::"
          echo "::group::Repo"
          pwd
          git log </dev/null | head -n20
          echo "::endgroup::"
          echo "::group::df -h"
          df -h
          echo "::endgroup::"
          echo "::group::free -h"
          free -h
          echo "::endgroup::"
          echo "::group::lscpu"
          lscpu
          echo "::endgroup::"
          echo "::group::docker images"
          docker images
          echo "::endgroup::"

      - name: Free runner disk space
        run: |
          # The suite fills the runner's root filesystem, which shows up as
          # container starts failing rather than as an obvious disk error.
          echo "::group::Before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          echo "::group::After"
          df -h /
          echo "::endgroup::"

      - name: Set up test storage
        run: |
          sudo mkdir -p /mnt/data
          sudo chown $USER:$USER /mnt/data
          mkdir -p /mnt/data/docker
          mkdir -p /mnt/data/workspace
          if [ "${{ matrix.mode }}" = "multinode" ]; then
            sudo rm -rf /mnt/data/docker-node1 /mnt/data/docker-node2
            sudo cp -a /mnt/data/docker /mnt/data/docker-node1
            sudo cp -a /mnt/data/docker /mnt/data/docker-node2
          fi

      - name: Set up Docker storage
        run: |
          echo "::group::Current disk usage"
          df -h
          echo "::endgroup::"
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Start the dojo for ${{ matrix.mode }} ${{ matrix.tier }} tests
        timeout-minutes: 75
        run: |
          COVERAGE_ARG=""
          if [ "${{ matrix.coverage }}" = "true" ]; then
            COVERAGE_ARG="-C"
          fi
          ./deploy.sh -b -g -D /mnt/data/docker -W /mnt/data/workspace ${{ matrix.mode == 'multinode' && '-M' || '' }} $COVERAGE_ARG

      - name: Build test image
        run: docker build --tag dojo-test test/

      - name: Run ${{ matrix.mode }} ${{ matrix.tier }} tests
        timeout-minutes: 60
        run: |
          COVERAGE_ARG=""
          if [ "${{ matrix.coverage }}" = "true" ]; then
            COVERAGE_ARG="-C"
          fi
          ./deploy.sh -g -D /mnt/data/docker -W /mnt/data/workspace ${{ matrix.mode == 'multinode' && '-M' || '' }} $COVERAGE_ARG -N -t -m '${{ matrix.selection }}'

      - name: Upload coverage reports to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: data/coverage/coverage.xml
          flags: ${{ matrix.tier }}
          name: ${{ matrix.tier }}

      - name: Output logs
        if: always()
        run: |
          echo "::group::Host docker ps"
          docker ps
          echo "::endgroup::"
          echo "::group::Host logs"
          journalctl -u '*' -b
          echo "::endgroup::"
          echo "::group::Main node systemd logs"
          docker exec dojo journalctl -u '*' -b || echo "No main outer container..."
          echo "::endgroup::"
          if [ "${{ matrix.mode }}" = "multinode" ]; then
            echo "::group::Workspace node 1 systemd logs"
            docker exec dojo-node1 journalctl -u '*' -b || echo "No node1 outer container..."
            echo "::endgroup::"
            echo "::group::Workspace node 2 systemd logs"
            docker exec dojo-node2 journalctl -u '*' -b || echo "No node2 outer container..."
            echo "::endgroup::"
          fi

      - name: Final filesystem information
        if: always()
        run: |
          echo "::group::Filesystem"
          df -h
          echo "::endgroup::"

  upload:
    name: Upload Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true

      - uses: cachix/install-nix-action@v31

      - name: Build and import outer NixOS image
        run: |
          nix build --print-build-logs .#dojo-image
          docker import \
            --change 'CMD ["/init"]' \
            --change 'ENV LC_CTYPE=C.UTF-8' \
            --change 'ENV PATH=/run/wrappers/bin:/run/current-system/sw/bin' \
            --change 'EXPOSE 22 80 443 8001' \
            --change 'STOPSIGNAL SIGRTMIN+3' \
            --change 'WORKDIR /opt/pwn.college' \
            result/tarball/nixos-system-*.tar.xz \
            pwncollege/dojo:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push pwncollege/dojo:latest
