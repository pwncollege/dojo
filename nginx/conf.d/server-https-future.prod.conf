server {
    include /etc/nginx/conf.d/future-dojo-host.conf;
    listen 443 ssl;
    http2 on;

    ssl_certificate /run/dojo/tls/fullchain.pem;
    ssl_certificate_key /run/dojo/tls/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /api/ {
        proxy_pass http://ctfd_upstream;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    location ^~ /pwncollege_api/ {
        proxy_pass http://ctfd_upstream;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
}
