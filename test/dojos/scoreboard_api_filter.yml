    content: |
      #!/opt/pwn.college/bash
      cat /flag
  - type: text
    path: cache/cherry/src
    content: |
      #!/opt/pwn.college/bash
      cat /flag
  - type: text
    path: window/fig/src
    content: |
      #!/opt/pwn.college/bash
      cat /flag
  - type: text
    path: lag/lemon/src
    content: |
      #!/opt/pwn.college/bash
      cat /flag
  - type: text
    path: counts/grape/src
    content: |
      #!/opt/pwn.college/bash
      cat /flag
  - type: text
    path: counts/grapefruit/src
    content: |
