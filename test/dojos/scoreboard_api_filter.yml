id: sb-api-filter
name: Scoreboard API Filter
type: public
modules:
  - id: hello
    name: SB Filter Hello
    challenges:
      - id: apple
        name: SB Filter Apple
  - id: dup
    name: SB Filter Dup
    challenges:
      - id: berry
        name: SB Filter Berry
  - id: shared
    name: SB Filter Shared
    challenges:
      - id: apple
        name: SB Filter Shared Apple
        import:
          dojo: example
          module: hello
          challenge: apple
  - id: cache
    name: SB Filter Cache
    challenges:
      - id: cherry
        name: SB Filter Cherry
  - id: window
    name: SB Filter Window
    challenges:
      - id: fig
        name: SB Filter Fig
  - id: lag
    name: SB Filter Lag
    challenges:
