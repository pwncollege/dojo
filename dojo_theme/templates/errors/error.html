{% extends "base.html" %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-12">
      <div class="pt-5 mt-5 text-center">
        <h1>{{ "Forbidden" if code == 403 else code }}</h1>
        <hr class="w-50">
        {% if code == 404 %}
        <h2>File not found</h2>
        <h2>Sorry about that</h2>
        {% elif code == 502 %}
        <h2>Bad Gateway</h2>
        {% else %}
        <h2>{{ error }}</h2>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
